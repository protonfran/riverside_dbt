version: 2

models:

  - name: stg_users
    description: >
      Deduplicated, type-cast user records from Bronze.
      One row per Riverside.fm account. Surrogate key is SHA-256 of the source UUID.
    columns:
      - name: user_sk
        description: Surrogate key (SHA-256 of user_nk)
        tests: [not_null, unique]
      - name: user_nk
        description: Natural key — source system user UUID
        tests: [not_null, unique]
      - name: email
        tests: [not_null]
      - name: plan_type
        tests:
          - not_null
          - accepted_values:
              values: ['free', 'standard', 'pro', 'business', 'enterprise', 'unknown']
      - name: plan_status
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'churned', 'trial', 'unknown']
      - name: created_at
        tests: [not_null]

  - name: stg_studios
    description: Deduplicated, type-cast studio (workspace) records from Bronze.
    columns:
      - name: studio_sk
        tests: [not_null, unique]
      - name: studio_nk
        tests: [not_null, unique]
      - name: user_sk
        description: FK to stg_users.user_sk
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_sk
      - name: plan_type
        tests:
          - accepted_values:
              values: ['free', 'standard', 'pro', 'business', 'enterprise', 'unknown']

  - name: stg_recordings
    description: >
      Deduplicated, type-cast recording sessions from Bronze.
      Only STATUS = 'completed' rows are included.
    columns:
      - name: recording_sk
        tests: [not_null, unique]
      - name: recording_nk
        tests: [not_null, unique]
      - name: studio_sk
        tests: [not_null]
      - name: host_user_sk
        tests: [not_null]
      - name: recording_type
        tests:
          - not_null
          - accepted_values:
              values: ['audio', 'video', 'screen', 'unknown']
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['completed']
      - name: duration_seconds
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 86400
      - name: participant_count
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 500
      - name: date_key
        tests: [not_null]

  - name: stg_participants
    description: >
      Deduplicated participant bridge. One row per participant per recording.
      Anonymous guests have user_sk = NULL and guest_email populated instead.
    columns:
      - name: participant_sk
        tests: [not_null, unique]
      - name: recording_sk
        tests: [not_null]
      - name: participant_role
        tests:
          - not_null
          - accepted_values:
              values: ['host', 'guest', 'producer']
      - name: session_duration_seconds
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 86400
              row_condition: "session_duration_seconds is not null"

  - name: stg_subscriptions
    description: Deduplicated subscription and billing records from Bronze.
    columns:
      - name: subscription_sk
        tests: [not_null, unique]
      - name: user_sk
        tests: [not_null]
      - name: plan_type
        tests:
          - accepted_values:
              values: ['free', 'standard', 'pro', 'business', 'enterprise', 'unknown']
      - name: billing_cycle
        tests:
          - accepted_values:
              values: ['monthly', 'annual', 'unknown']
      - name: mrr_usd_normalised
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100000
              row_condition: "mrr_usd_normalised is not null"
      - name: is_active
        tests: [not_null]
