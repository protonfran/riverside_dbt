version: 2

models:

  - name: dim_user
    description: >
      User dimension — SCD Type 1. One row per Riverside.fm account.
      Rebuilt fully on each dbt run; attribute changes overwrite in place.
      Includes denormalised active subscription details for BI convenience.
    columns:
      - name: user_sk
        description: Surrogate key
        tests: [not_null, unique]
      - name: user_nk
        tests: [not_null, unique]
      - name: email
        tests: [not_null]
      - name: plan_type
        tests:
          - not_null
          - accepted_values:
              values: ['free', 'standard', 'pro', 'business', 'enterprise', 'unknown']
      - name: plan_tier
        tests:
          - not_null
          - accepted_values:
              values: ['Tier 1', 'Tier 2', 'Tier 3', 'Tier 4', 'Free']
      - name: plan_status
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'churned', 'trial', 'unknown']
      - name: current_mrr_usd
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100000
              row_condition: "current_mrr_usd is not null"

  - name: dim_studio
    description: >
      Studio dimension — SCD Type 1. One row per Riverside.fm studio/workspace.
      Owner details denormalised from dim_user.
    columns:
      - name: studio_sk
        tests: [not_null, unique]
      - name: studio_nk
        tests: [not_null, unique]
      - name: owner_email
        description: Denormalised from dim_user — may be null if user was deleted
